</head><body><title>Мегдан</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Мегдан: площадът, където се събират приятелите. Играчките са пластмасови фигурки:
   плътни цветове, дебела сянка отдолу, натискат се надолу. Шевицата е само в марката.
   Оформление: едноколонно приложение (телефон първо); на широк екран играта вляво, чатът вдясно. */
:root {
  --bg: #eef2ea;
  --surface: #ffffff;
  --surface-2: #e2e8dc;
  --ink: #1b2333;
  --ink-2: #4f5a72;
  --line: #cfd7c6;
  --accent: #d93226;
  --accent-ink: #ffffff;
  --sun: #f5b51f;
  --focus: #2b66d9;
  --ok: #1d855a;
  --bad: #c42b20;
  --seat-1: #d93226;
  --seat-2: #2b66d9;
  --seat-3: #e9a90f;
  --seat-4: #1d9563;
  --seat-5: #8550db;
  --seat-6: #ea7316;
  --board: #23407f;
  --board-hole: #eef2ea;
  --board-hole-hi: #ffffff;
  --felt: #1d7a55;
  --felt-edge: #145c40;
  --toy-shadow: rgb(27 35 51 / .22);
  --shadow-pop: 0 6px 0 var(--toy-shadow);
  --f-display: "Unbounded", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-pill: 999px;
  --r-lg: 20px;
  --r-md: 14px;
  --step--1: .8125rem;
  --step-0: 1rem;
  --step-1: 1.25rem;
  --step-2: 1.6rem;
  --step-3: 2.2rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121826; --surface: #1c2435; --surface-2: #263047; --ink: #eef1f7; --ink-2: #a3adc4;
    --line: #34405a; --accent: #ff5545; --accent-ink: #1a0503; --sun: #ffc743; --focus: #86adff;
    --ok: #45c48c; --bad: #ff6b5e;
    --seat-1: #ff5545; --seat-2: #5b8dff; --seat-3: #ffc743; --seat-4: #3fc386; --seat-5: #a77dff; --seat-6: #ff9440;
    --board: #2c4c9e; --board-hole: #0f1420; --board-hole-hi: #1f2840; --felt: #1a6b4b; --felt-edge: #0f3f2c;
    --toy-shadow: rgb(0 0 0 / .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121826; --surface: #1c2435; --surface-2: #263047; --ink: #eef1f7; --ink-2: #a3adc4;
  --line: #34405a; --accent: #ff5545; --accent-ink: #1a0503; --sun: #ffc743; --focus: #86adff;
  --ok: #45c48c; --bad: #ff6b5e;
  --seat-1: #ff5545; --seat-2: #5b8dff; --seat-3: #ffc743; --seat-4: #3fc386; --seat-5: #a77dff; --seat-6: #ff9440;
  --board: #2c4c9e; --board-hole: #0f1420; --board-hole-hi: #1f2840; --felt: #1a6b4b; --felt-edge: #0f3f2c;
  --toy-shadow: rgb(0 0 0 / .5); color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 var(--step-0)/1.5 var(--f-body);
  -webkit-tap-highlight-color: transparent;
}
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: var(--step-3); letter-spacing: -.02em; }
h2 { font-size: var(--step-2); letter-spacing: -.01em; }
h3 { font-size: var(--step-1); font-weight: 600; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; }

/* ---- рамка на приложението ---- */
.app { min-height: 100%; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.topbar-row { max-width: 1040px; margin-inline: auto; display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 4px 0; cursor: pointer; }
.brand-word { font: 800 1.35rem/1 var(--f-display); letter-spacing: -.03em; }
/* Шевица: кръстат бод в червено и жълто. Единственото „народно“ място. */
.brand-mark {
  width: 30px; height: 30px; border-radius: 8px; flex: none;
  background:
    conic-gradient(from 45deg at 50% 50%, var(--accent) 0 25%, transparent 0 50%, var(--accent) 0 75%, transparent 0) 0 0 / 10px 10px,
    var(--sun);
  box-shadow: inset 0 0 0 3px var(--ink);
}
.stitch {
  height: 8px;
  background:
    linear-gradient(135deg, var(--accent) 33%, transparent 34%) 0 0 / 16px 8px repeat-x,
    linear-gradient(225deg, var(--accent) 33%, transparent 34%) 0 0 / 16px 8px repeat-x,
    var(--sun);
}
.spacer { flex: 1; }
.main {
  flex: 1; width: 100%; max-width: 1040px; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  display: flex; flex-direction: column; gap: 24px;
}

/* ---- бутони-играчки ---- */
.btn {
  --b-bg: var(--surface); --b-fg: var(--ink); --b-edge: var(--toy-shadow);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 10px 20px; border-radius: var(--r-pill);
  border: 2px solid var(--ink); background: var(--b-bg); color: var(--b-fg);
  font: 700 var(--step-0)/1.1 var(--f-body); white-space: nowrap; cursor: pointer;
  box-shadow: 0 4px 0 var(--ink);
  transition: transform .08s ease, box-shadow .08s ease;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 5px 0 var(--ink); }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-primary { --b-bg: var(--accent); --b-fg: var(--accent-ink); }
.btn-sun { --b-bg: var(--sun); --b-fg: #1b2333; }
.btn-small { min-height: 40px; padding: 6px 14px; font-size: var(--step--1); box-shadow: 0 3px 0 var(--ink); }
.btn-icon { width: 44px; min-height: 44px; padding: 0; font-size: 1.15rem; }
.btn-quiet { border-color: transparent; box-shadow: none; background: transparent; }
.btn-quiet:hover:not(:disabled) { box-shadow: none; background: var(--surface-2); }
.btn-quiet:active:not(:disabled) { transform: none; }

/* ---- полета ---- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; font-size: var(--step--1); }
.input {
  min-height: 48px; padding: 10px 14px; border-radius: var(--r-md);
  border: 2px solid var(--line); background: var(--surface); color: var(--ink);
}
.input:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
.hint { font-size: var(--step--1); color: var(--ink-2); }
.error { font-size: var(--step--1); color: var(--bad); font-weight: 500; }

/* ---- аватари ---- */
.avatar {
  --av: var(--seat-2);
  width: 40px; height: 40px; flex: none; border-radius: 50%;
  display: grid; place-items: center; font-size: 1.3rem; line-height: 1;
  background: color-mix(in srgb, var(--av) 22%, var(--surface));
  box-shadow: inset 0 0 0 3px var(--av);
}
.avatar.lg { width: 72px; height: 72px; font-size: 2.3rem; box-shadow: inset 0 0 0 4px var(--av); }
.avatar.sm { width: 30px; height: 30px; font-size: 1rem; box-shadow: inset 0 0 0 2px var(--av); }

/* ---- профил ---- */
.profile-card { display: flex; flex-direction: column; gap: 20px; max-width: 520px; width: 100%; margin-inline: auto; }
.profile-preview { display: flex; align-items: center; gap: 16px; }
.choice-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 8px; }
.choice {
  aspect-ratio: 1; min-height: 48px; border-radius: var(--r-md); border: 2px solid var(--line);
  background: var(--surface); font-size: 1.5rem; cursor: pointer; display: grid; place-items: center;
}
.choice[aria-pressed="true"] { border-color: var(--ink); background: var(--surface-2); box-shadow: 0 3px 0 var(--ink); }
.swatch { border-radius: 50%; background: var(--sw); border: 3px solid var(--surface); box-shadow: 0 0 0 2px var(--line); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); }

/* ---- лоби ---- */
.lobby-hero { display: grid; gap: 16px; }
.join-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; }
.code-input {
  width: 9.5ch; min-height: 56px; text-align: center; letter-spacing: .3em; text-transform: uppercase;
  font: 800 1.5rem/1 var(--f-display); padding-inline: 12px .7em;
}
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 16px; }
@media (max-width: 559px) {
  .games { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .game-art { height: 88px; overflow: hidden; }
  .game-art > * { transform: scale(.78); }
  .game-info { padding: 10px; }
  .game-info h3 { font-size: .92rem; }
  .game-info .muted { display: none; }
  .games .game-tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
}
.game-tile {
  display: grid; grid-template-rows: auto 1fr; text-align: left; padding: 0; overflow: hidden;
  border: 2px solid var(--ink); border-radius: var(--r-lg); background: var(--surface); cursor: pointer;
  box-shadow: 0 5px 0 var(--ink); transition: transform .08s ease, box-shadow .08s ease;
}
.game-tile:hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--ink); }
.game-tile:active { transform: translateY(5px); box-shadow: 0 0 0 var(--ink); }
.game-art { height: 112px; display: grid; place-items: center; background: var(--tile-bg, var(--surface-2)); border-bottom: 2px solid var(--ink); }
.game-info { padding: 12px 14px 14px; display: grid; gap: 4px; }
.game-info h3 { font-size: 1.05rem; }
.game-meta { font-size: var(--step--1); color: var(--ink-2); }

/* ---- стая ---- */
.room { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .room { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; } }
.room-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.room-code { font: 800 var(--step-2)/1 var(--f-display); letter-spacing: .12em; }
.seats { display: flex; flex-wrap: wrap; gap: 8px; }
.seat {
  display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: var(--r-pill);
  background: var(--surface); border: 2px solid var(--line); min-width: 0; max-width: 100%;
}
.seat { transition: border-color .25s, box-shadow .25s, transform .25s cubic-bezier(.2,1.4,.4,1), background-color .25s; }
.seat.turn { --c: var(--disc, var(--ink)); border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--surface));
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 30%, transparent), 0 3px 0 var(--c); transform: translateY(-2px); }
.seat.turn .avatar { box-shadow: inset 0 0 0 2px var(--av), 0 0 0 3px var(--c); }
.turn-sub { display: flex; align-items: center; gap: 4px; color: var(--ink) !important; font-weight: 700; }
.think { display: inline-flex; gap: 2px; }
.think i { width: 4px; height: 4px; border-radius: 50%; background: var(--c, var(--ink)); animation: think 1.2s ease-in-out infinite; }
.think i:nth-child(2) { animation-delay: .15s; } .think i:nth-child(3) { animation-delay: .3s; }
@keyframes think { 0%, 60%, 100% { transform: none; opacity: .4; } 30% { transform: translateY(-3px); opacity: 1; } }
.seat-x { width: 32px; min-height: 32px; margin-left: -4px; }
.seat .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 12ch; }
.seat .sub { font-size: var(--step--1); color: var(--ink-2); }
.seat.away { opacity: .55; }
.badge { font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: var(--r-pill); background: var(--surface-2); }
.badge.ok { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); color: var(--ok); }
.stage { display: grid; gap: 14px; min-width: 0; }
.board-wrap { display: grid; justify-items: center; min-width: 0; }
.disc-dot { width: 16px; height: 16px; flex: none; border-radius: 50%; background: var(--disc); box-shadow: inset 0 -3px 0 rgb(0 0 0 / .2); }
.status-line { display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 700; font-size: var(--step-1); }
.status-line.has-turn { padding: 6px 12px 6px 6px; border-radius: var(--r-pill); background: color-mix(in srgb, var(--turn) 12%, var(--surface));
  border: 2px solid color-mix(in srgb, var(--turn) 45%, var(--line)); transition: background-color .3s, border-color .3s; }
.status-line.has-turn:not(:has(.avatar)) { padding-left: 14px; }
.status-line .status-text { min-width: 0; }
.status-line.mine { color: var(--ink); background: color-mix(in srgb, var(--turn) 24%, var(--surface)); border-color: var(--turn);
  box-shadow: 0 3px 0 var(--turn); }
.status-line.mine.pop { animation: minePulse .9s cubic-bezier(.2,1.5,.4,1); }
@keyframes minePulse { 0% { transform: scale(.94); } 60% { transform: scale(1.03); } 100% { transform: none; } }
/* Докато си на ход, дъската свети в твоя цвят. */
.board-wrap { border-radius: calc(var(--r-lg) + 6px); transition: box-shadow .35s; }
.board-wrap.my-turn { box-shadow: 0 0 0 3px var(--turn), 0 0 0 7px color-mix(in srgb, var(--turn) 18%, transparent); padding: 6px; animation: boardGlow 2.6s ease-in-out infinite; }
@keyframes boardGlow { 50% { box-shadow: 0 0 0 3px var(--turn), 0 0 0 10px color-mix(in srgb, var(--turn) 10%, transparent), 0 0 26px 4px color-mix(in srgb, var(--turn) 30%, transparent); } }
.stage { position: relative; }
.turn-pop { position: absolute; left: 50%; top: -6px; z-index: 20; pointer-events: none; padding: 14px 26px; border-radius: var(--r-pill);
  background: var(--turn); color: #fff; border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink), 0 18px 40px rgb(0 0 0 / .25);
  font: 800 clamp(1.4rem, 7vw, 2.2rem)/1 var(--f-display); white-space: nowrap; text-shadow: 0 2px 0 rgb(0 0 0 / .25);
  transform: translateX(-50%); animation: turnPop 1.5s cubic-bezier(.2,1.4,.4,1) .35s both; }
@keyframes turnPop {
  0% { transform: translateX(-50%) scale(.3) rotate(-8deg); opacity: 0; }
  22% { transform: translateX(-50%) scale(1.08) rotate(2deg); opacity: 1; }
  34% { transform: translateX(-50%) scale(1) rotate(0); }
  78% { transform: translateX(-50%) scale(1); opacity: 1; }
  100% { transform: translateX(-50%) translateY(-24px) scale(.9); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .think i, .board-wrap.my-turn, .status-line.mine { animation: none; }
  .turn-pop { animation: turnPopCalm .9s linear forwards; }
  @keyframes turnPopCalm { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
}
.timer { margin-left: auto; font: 600 var(--step-0)/1 var(--f-display); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); }
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: grid; gap: 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* ---- чат ---- */
.chat { display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 10px; max-height: 70vh; }
.chat-log { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; min-height: 120px; max-height: 40vh; padding-right: 4px; }
.msg { display: flex; gap: 8px; align-items: flex-start; }
.msg .bubble { background: var(--surface-2); padding: 6px 10px; border-radius: 14px; overflow-wrap: anywhere; min-width: 0; }
.msg .who { font-size: .75rem; font-weight: 700; color: var(--ink-2); }
.msg.big .bubble { background: none; font-size: 1.8rem; padding: 0 4px; }
.reactions { display: flex; gap: 6px; flex-wrap: wrap; }
.reactions button { font-size: 1.3rem; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); cursor: pointer; }
.chat-form { display: flex; gap: 8px; }
.chat-form .input { flex: 1; min-width: 0; }
.float-emoji { position: fixed; z-index: 30; font-size: 2.4rem; pointer-events: none; animation: floatUp 1.6s ease-out forwards; }
@keyframes floatUp { to { transform: translateY(-40vh) scale(1.3); opacity: 0; } }

/* ---- известия ---- */
.toast-wrap {
  position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; display: grid; justify-items: center; gap: 8px; pointer-events: none;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.toast {
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--r-pill); font-weight: 700;
  max-width: 100%; animation: toastIn .2s ease-out; pointer-events: auto;
}
@keyframes toastIn { from { transform: translateY(12px); opacity: 0; } }
.result-banner {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--r-lg);
  background: var(--sun); color: #1b2333; border: 2px solid var(--ink); box-shadow: 0 5px 0 var(--ink);
}
.result-banner h2 { font-size: var(--step-1); }
.empty { padding: 24px; text-align: center; color: var(--ink-2); display: grid; gap: 10px; justify-items: center; }

/* ---- класация ---- */
.board-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.board-table th { text-align: left; font-size: var(--step--1); color: var(--ink-2); font-weight: 500; padding: 6px 8px; }
.board-table td { padding: 10px 8px; border-top: 2px solid var(--line); }
.board-table .r { text-align: right; }
.table-wrap { overflow-x: auto; }

/* ---- навигация ---- */
a.brand { text-decoration: none; color: inherit; }
.nav-top { display: none; gap: 4px; margin-left: 12px; }
.nav-top-item, .nav-bottom-item { position: relative; text-decoration: none; color: var(--ink-2); font-weight: 700; }
.nav-top-item { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: var(--r-pill); }
.nav-top-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-top-item[aria-current="page"] { background: var(--ink); color: var(--bg); }
.nav-icon { display: inline-grid; place-items: center; font-size: 1.15rem; line-height: 1; }
.nav-badge {
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--r-pill); background: var(--accent); color: var(--accent-ink);
  font-size: .75rem; font-weight: 800; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums;
}
.nav-bottom {
  position: fixed; z-index: 15; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--surface); border-top: 2px solid var(--ink);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.nav-bottom-item { display: grid; justify-items: center; gap: 2px; padding: 6px 4px; border-radius: var(--r-md); font-size: .75rem; min-height: 48px; }
.nav-bottom-item[aria-current="page"] { color: var(--ink); background: var(--surface-2); }
.nav-bottom-item .nav-badge { position: absolute; top: 2px; left: calc(50% + 6px); }
.nav-top-item .nav-badge { margin-left: 2px; }
body.first-run .nav-bottom, body.first-run .nav-top { display: none; }
@media (max-width: 719px) {
  .main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  .toast-wrap { padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }
  body.in-room .toast-wrap { padding-bottom: calc(148px + env(safe-area-inset-bottom, 0px)); }
}
@media (min-width: 720px) {
  .nav-top { display: flex; }
  .nav-bottom { display: none; }
}
.avatar.xs { width: 24px; height: 24px; font-size: .8rem; box-shadow: inset 0 0 0 2px var(--av); }

/* ---- лист (диалог) ---- */
.sheet {
  border: 2px solid var(--ink); border-radius: var(--r-lg) var(--r-lg) 0 0; padding: 0; margin: auto auto 0;
  width: 100%; max-width: 560px; max-height: 88vh; background: var(--surface); color: var(--ink);
  box-shadow: 0 -6px 0 var(--toy-shadow);
}
.sheet::backdrop { background: rgb(18 24 38 / .45); }
.sheet[open] { animation: sheetUp .22s ease-out; }
@keyframes sheetUp { from { transform: translateY(40px); opacity: .5; } }
@media (min-width: 720px) { .sheet { margin: auto; border-radius: var(--r-lg); box-shadow: 0 8px 0 var(--ink); } }
.sheet-inner { display: grid; gap: 14px; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.sheet-head h2 { flex: 1; }
.sheet-body { display: grid; gap: 12px; min-width: 0; }
.sheet-body h3 { font-size: 1rem; }
.sheet-game { display: flex; gap: 14px; align-items: center; }
.sheet-art { height: auto; padding: 10px; border: 2px solid var(--ink); border-radius: var(--r-md); flex: none; }
.rules { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; max-width: 60ch; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  min-height: 40px; padding: 6px 14px; border-radius: var(--r-pill); border: 2px solid var(--ink); background: var(--surface);
  font-weight: 700; cursor: pointer;
}
.pill[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.picker-list { display: grid; gap: 8px; }
.picker-item {
  display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 52px; padding: 8px 14px;
  border-radius: var(--r-md); border: 2px solid var(--line); background: var(--surface); text-align: left; cursor: pointer;
}
.picker-item[aria-pressed="true"] { border-color: var(--ink); background: var(--surface-2); }
.picker-name { font-weight: 700; }
.field-label { font-weight: 700; font-size: var(--step--1); }

/* ---- стая: дъската първо ---- */
.room-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.code-chip {
  display: inline-grid; justify-items: start; gap: 0; padding: 4px 14px 6px; border-radius: var(--r-md);
  border: 2px solid var(--ink); background: var(--sun); color: #1b2333; cursor: pointer; box-shadow: 0 3px 0 var(--ink);
}
.code-chip:active { transform: translateY(3px); box-shadow: none; }
.code-chip-label { font-size: .7rem; font-weight: 700; }
.code-chip-code { font: 800 1.15rem/1 var(--f-display); letter-spacing: .14em; }
.room-bar { flex-wrap: nowrap; }
.room-game { flex: 1 1 0; font-weight: 700; color: var(--ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.room-bar .btn-small { padding-inline: 10px; flex: none; }
.seats-row { flex-wrap: nowrap; overflow-x: auto; padding: 6px 6px 8px; margin: -6px -6px -4px; scrollbar-width: thin; }
.seats-row .seat { flex: none; }
.board-actions { justify-content: center; }
.join-banner { padding: 12px 14px; border-radius: var(--r-md); background: color-mix(in srgb, var(--sun) 30%, var(--surface)); border: 2px solid var(--sun); font-weight: 700; }
.invite-cta { display: grid; justify-items: center; gap: 6px; padding: 14px; border-radius: var(--r-lg); background: color-mix(in srgb, var(--sun) 22%, var(--surface)); border: 2px dashed color-mix(in srgb, var(--sun) 70%, var(--ink)); text-align: center; }
.btn-big { min-height: 56px; padding-inline: 26px; font-size: var(--step-1); gap: 10px; }
.setup-game { display: flex; gap: 14px; align-items: center; }
.setup-art { height: auto; padding: 10px; border: 2px solid var(--ink); border-radius: var(--r-md); flex: none; }
.chat-head { display: flex; align-items: center; justify-content: space-between; }
.chat-close { display: none; }
.chat-fab { display: none; }
.invite-fallback { user-select: all; background: var(--surface); padding: 8px 12px; border-radius: var(--r-md); border: 2px dashed var(--line); }
@media (max-width: 899px) {
  .chat-sheet {
    position: fixed; z-index: 25; left: 0; right: 0; bottom: 0; max-height: 78vh; border-radius: var(--r-lg) var(--r-lg) 0 0;
    border: 2px solid var(--ink); transform: translateY(105%); transition: transform .22s ease-out; visibility: hidden;
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  .chat-close { display: inline-flex; }
  .chat-fab {
    display: inline-flex; align-items: center; gap: 6px; position: fixed; z-index: 16;
    right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    min-height: 52px; min-width: 52px; justify-content: center; padding: 6px; border-radius: var(--r-pill); border: 2px solid var(--ink); font-size: 1.3rem;
    background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 4px 0 var(--ink); cursor: pointer;
  }

@media (min-width: 720px) and (max-width: 899px) { .chat-fab { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); } }

.fab-count {
  min-width: 22px; height: 22px; padding: 0 6px; border-radius: var(--r-pill); background: var(--accent); color: var(--accent-ink);
  font-size: .75rem; font-weight: 800; display: inline-grid; place-items: center;

/* ---- моите стаи ---- */
.room-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.room-list li { position: relative; }
.room-card {
  width: 100%; display: flex; gap: 14px; align-items: center; padding: 12px 52px 12px 12px; text-align: left; cursor: pointer;
  border: 2px solid var(--line); border-radius: var(--r-lg); background: var(--surface);
}
.room-card.hot { border-color: var(--ink); box-shadow: 0 4px 0 var(--ink); }
.room-card:disabled { opacity: .6; cursor: default; }
.room-card-art { flex: none; width: 72px; height: 72px; display: grid; place-items: center; overflow: hidden; border-radius: var(--r-md); background: var(--surface-2); }
.room-card-art > * { transform: scale(.6); }
.room-card-info { display: grid; gap: 6px; min-width: 0; }
.room-card-top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.room-card-name { font-weight: 800; font-family: var(--f-display); font-size: 1rem; }
.room-card-code { font-weight: 700; color: var(--ink-2); letter-spacing: .12em; font-size: var(--step--1); }

.room-card-x { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); }
.chip { justify-self: start; font-size: var(--step--1); font-weight: 700; padding: 2px 10px; border-radius: var(--r-pill); background: var(--surface-2); }
.chip.hot { background: var(--accent); color: var(--accent-ink); }

}
.turn-banner-count { font: 800 1.4rem/1 var(--f-display); }
.turn-banner-go { margin-left: auto; text-decoration: underline; white-space: nowrap; }

.series-box { display: grid; gap: 8px; padding: 12px; border-radius: var(--r-md); background: var(--surface-2); }
.series-box h3 { font-size: 1rem; }
.series-list { margin: 0; padding-left: 1.4em; display: grid; gap: 2px; }
.series-list li.done { color: var(--ink-2); text-decoration: line-through; }
.series-list li.now { font-weight: 800; }
.series-table { display: grid; gap: 4px; }
.series-row { display: flex; align-items: center; gap: 8px; }
.series-row.lead .series-name { font-weight: 800; }
.series-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.series-pts { font-weight: 800; }
.series-pick { display: flex; flex-wrap: wrap; gap: 8px; }
.series-game { display: inline-flex; align-items: center; gap: 6px; }
.series-n { min-width: 1.2em; font-weight: 800; }
.series-n:empty { display: none; }
.result-banner.champ { background: var(--accent); color: var(--accent-ink); }
.lb-tabs { flex-wrap: nowrap; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: thin; }
.lb-tabs .btn { flex: none; }
.lb-name { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.lb-link { border: 0; background: none; padding: 4px 0; cursor: pointer; font-weight: 700; text-align: left; }
.lb-link:hover span:not(.chip):not(.avatar) { text-decoration: underline; }
.versus-total { font: 800 2.4rem/1 var(--f-display); }
.h2h { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.h2h-label { font-size: var(--step--1); font-weight: 700; color: var(--ink-2); }

.h2h-name { font-weight: 700; max-width: 10ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.h2h-score { font-weight: 800; }
.h2h-all { font-size: .75rem; color: var(--ink-2); }

/* Лист от тетрадка на квадратчета; линиите са като от химикал. */
.db { --dot: 12px; display:grid; width:min(100%,420px); aspect-ratio:1; margin-inline:auto; padding:12px; border-radius:6px;
  background:
    repeating-linear-gradient(0deg, transparent 0 13px, rgb(70 120 210 / .16) 13px 14px),
    repeating-linear-gradient(90deg, transparent 0 13px, rgb(70 120 210 / .16) 13px 14px),
    linear-gradient(170deg,#fffdf6,#f6f1e2);
  box-shadow: 0 1px 0 #e7e0cc, 0 3px 0 #ddd5bd, 0 5px 0 #d2c9ae, 0 10px 18px rgb(60 45 10 / .22); transform: rotate(-.6deg); }
.db-dot { border-radius:50%; position:relative; z-index:2; background:radial-gradient(circle at 35% 30%, #4a5366, #1b2333 70%); box-shadow:0 1px 1px rgb(0 0 0 / .3); }
.db-line { border:0; padding:0; background:transparent; position:relative; cursor:pointer; border-radius:6px; }
.db-line::before { content:""; position:absolute; border-radius:6px; background:rgb(27 35 51 / .14); }
.db-line.hz::before { left:-2px; right:-2px; top:50%; height:5px; transform:translateY(-50%); }
.db-line.vt::before { top:-2px; bottom:-2px; left:50%; width:5px; transform:translateX(-50%); }
.db-line::after { content:""; position:absolute; inset:-12px; }
.db-line.hz::after { left:4px; right:4px; }
.db-line.vt::after { top:4px; bottom:4px; }
.db-line:not(:disabled):hover::before, .db-line:focus-visible::before { background:color-mix(in srgb, var(--me, #1b2333) 55%, transparent); }
/* Дупки за класьор отляво. */
.db { position:relative; }
.db::before { content:''; position:absolute; left:-1px; top:12%; bottom:12%; width:9px; pointer-events:none;
  background: radial-gradient(circle at 50% 50%, var(--bg) 0 3.5px, rgb(0 0 0 / .18) 4px, transparent 5px) 0 0 / 9px 33.3% repeat-y; }
.db-line:disabled { cursor:default; }
.db-line.drawn::before { background:linear-gradient(var(--stroke), color-mix(in srgb, var(--stroke) 75%, #000)); box-shadow:0 1px 1px rgb(0 0 0 / .2); }

/* Новата линия се изписва от единия край до другия. */
.db-line.hz.fresh::before { transform-origin:left center; animation: dbDrawH .35s ease-out; }
.db-line.vt.fresh::before { transform-origin:center top; animation: dbDrawV .35s ease-out; }
@keyframes dbDrawH { from { transform:translateY(-50%) scaleX(0); } to { transform:translateY(-50%) scaleX(1); } }
@keyframes dbDrawV { from { transform:translateX(-50%) scaleY(0); } to { transform:translateX(-50%) scaleY(1); } }
.db-box { display:grid; place-items:center; border-radius:3px; margin:4px; }
.db-box.owned { background:color-mix(in srgb, var(--box) 20%, transparent); }
/* Печат с буквата на играча. */
.db-stamp { display:grid; place-items:center; width:72%; aspect-ratio:1; border-radius:50%; border:2.5px solid var(--box); color:var(--box);
  font:800 clamp(.75rem,3.8vw,1.15rem)/1 var(--f-display); transform:rotate(var(--rot)); opacity:.9; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--box) 20%, transparent); }
.db-box.new .db-stamp { animation: dbStamp .45s cubic-bezier(.2,1.5,.4,1) .3s backwards; }
@keyframes dbStamp { from { transform:rotate(calc(var(--rot) - 25deg)) scale(1.9); opacity:0; } }
.db-art { display:grid; grid-template-columns:repeat(2,34px); gap:6px; padding:8px; border:3px dotted var(--ink); border-radius:8px; }
.db-art span { height:34px; border:3px solid var(--ink); border-radius:3px; }
.db-art .o1 { background:var(--seat-1); }
.db-art .o2 { background:var(--seat-2); }
@media (prefers-reduced-motion: reduce) { .db-line.fresh::before, .db-box.new .db-stamp { animation:none; } }

.ut-over.draw-txt { display:grid; place-items:center; font:800 clamp(2.4rem,14vw,4.4rem)/1 var(--f-display); color:rgb(240 240 230 / .8); width:auto; height:auto; inset:0; }

  background: var(--wood), linear-gradient(180deg,#8a5a2c,#5a3214); box-shadow: 0 6px 10px rgb(0 0 0 / .25); }
.ut-tray .chalk { position:absolute; top:3px; height:7px; border-radius:3px; box-shadow:0 1px 1px rgb(0 0 0 / .3); }

.ut-tray .sponge { position:absolute; right:10%; top:-4px; width:54px; height:14px; border-radius:4px; background:linear-gradient(#e9c46a 0 45%, #3b3b3b 45%); box-shadow:0 2px 2px rgb(0 0 0 / .35); }

.ut-art span { height:24px; background:var(--surface); border-radius:4px; display:grid; place-items:center; font:800 .9rem/1 var(--f-display); }

.ld-bar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center; margin-bottom:10px; }
.ld-bar .hint { min-height:1.4em; }
.ld { position:relative; display:grid; grid-template-columns:repeat(11,minmax(0,1fr)); grid-template-rows:repeat(11,auto); gap:3px; width:min(100%,440px); margin-inline:auto;
  padding:12px; border-radius:18px; border:2px solid #3a200c;
  background: var(--grain), linear-gradient(160deg,#fbf0d9,#f0dcb4);
  box-shadow: inset 0 0 0 7px #b0753c, inset 0 0 0 9px #6b3d1b, inset 0 3px 10px rgb(80 45 10 / .25), 0 8px 0 #4a2810, 0 16px 26px rgb(40 20 5 / .3); }
.ld::before { content:''; position:absolute; inset:2px; border-radius:16px; background:var(--wood); opacity:.55; pointer-events:none; mask: linear-gradient(#000 0 0) exclude, linear-gradient(#000 0 0) content-box; padding:7px; }
/* Ъгъл в цвета на играча и бял двор за базата. */
.ld-quad { z-index:0; margin:-2px; border-radius:14px; background:
  radial-gradient(120% 120% at 30% 25%, color-mix(in srgb, var(--tint) 55%, #fff), color-mix(in srgb, var(--tint) 85%, #000));
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--tint) 60%, #000), inset 0 2px 0 rgb(255 255 255 / .35); }
.ld-yard { z-index:0; margin:-5px; border-radius:50%; background:radial-gradient(circle at 45% 40%, #fffaf0, #efe2c4);
  box-shadow: inset 0 3px 6px rgb(60 30 0 / .3), 0 0 0 3px rgb(255 255 255 / .55); }
.ld-mid { z-index:0; margin:-1px; border-radius:6px; background: conic-gradient(from -45deg, var(--t1) 0 25%, var(--t2) 0 50%, var(--t3) 0 75%, var(--t0) 0);
  opacity:.55; box-shadow: inset 0 0 0 2px rgb(0 0 0 / .2); }
.ld > .ld-cell, .ld > .ld-piece, .ld > .ld-center { position:relative; z-index:1; }
.ld-cell.start::after { content:'›'; position:absolute; inset:0; display:grid; place-items:center; color:#fff; font:800 clamp(.8rem,4vw,1.2rem)/1 var(--f-display);
  transform:rotate(var(--rot)); text-shadow:0 1px 1px rgb(0 0 0 / .4); }
/* Клетки: вдлъбнати гнезда. */
.ld-cell { aspect-ratio:1; border-radius:50%; grid-area:auto; background:radial-gradient(circle at 50% 40%, #fffaf0, #eadbbd);
  box-shadow: inset 0 2px 3px rgb(80 50 10 / .3), inset 0 -1px 0 rgb(255 255 255 / .8), 0 0 0 1.5px rgb(120 80 30 / .35); }
.ld-cell.start, .ld-cell.home { background:radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--tint) 45%, #fff), color-mix(in srgb, var(--tint) 70%, #fff));
  box-shadow: inset 0 2px 3px rgb(0 0 0 / .25), 0 0 0 2px var(--tint); }
.ld-cell.base { background:radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--tint) 18%, #fff), color-mix(in srgb, var(--tint) 32%, #fff));
  box-shadow: inset 0 2px 3px rgb(0 0 0 / .2), 0 0 0 2px color-mix(in srgb, var(--tint) 60%, #fff); }
.ld-center { display:grid; place-items:center; --die-size:100%; }
.ld-center .die3d { width:92%; padding:12%; }
/* Пионка, гледана отгоре: основа, вдлъбнатина и глава. */
.ld-piece { --edge: color-mix(in srgb, var(--p) 50%, #000); z-index:2 !important; place-self:center; width:80%; aspect-ratio:1; border-radius:50%; padding:0; position:relative;
  border:1px solid rgb(0 0 0 / .5);
  background:
    radial-gradient(circle at 42% 36%, color-mix(in srgb, var(--p) 30%, #fff) 0 9%, color-mix(in srgb, var(--p) 85%, #fff) 16%, var(--p) 30%, color-mix(in srgb, var(--p) 65%, #000) 38%, transparent 40%),
    radial-gradient(circle at 40% 32%, color-mix(in srgb, var(--p) 55%, #fff) 0 18%, var(--p) 55%, color-mix(in srgb, var(--p) 70%, #000) 100%);
  box-shadow: 0 2px 0 var(--edge), 0 4px 5px rgb(0 0 0 / .35); transition: transform .2s cubic-bezier(.2,1.4,.4,1); }
.ld-piece.can { cursor:pointer; animation:ldpulse .8s ease-in-out infinite alternate; }
.ld-piece.last { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--edge), 0 2px 0 var(--edge), 0 4px 5px rgb(0 0 0 / .35); }
.ld-piece:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
/* Без transform: движещ се бутон е трудно докосваем (и нестабилен за тестовете). */

.bs-place { display:grid; gap:12px; justify-items:center; width:100%; }
.bs-board-wrap { width:100%; }
.bs-grid { display:grid; grid-template-columns:repeat(10,minmax(0,1fr)); gap:2px; width:min(100%,400px); margin-inline:auto; padding:6px;
  background:linear-gradient(160deg,#2b4f7e,#18304f); border-radius:var(--r-md); box-shadow: inset 0 2px 0 rgb(255 255 255 / .15), 0 6px 0 #10223a, 0 12px 20px rgb(0 0 0 / .25); }
.bs-grid.small { width:min(100%,280px); }
.bs-radar { display:grid; grid-template-columns:16px 1fr; grid-template-rows:16px auto; width:min(100%,420px); margin-inline:auto; }
.bs-radar.small { width:min(100%,296px); }
.bs-radar .bs-grid { width:100%; }
.bs-top { display:grid; grid-template-columns:repeat(10,1fr); gap:2px; padding:0 6px; align-items:end; }
.bs-left { display:grid; grid-template-rows:repeat(10,1fr); gap:2px; padding:6px 0; align-items:center; }
.bs-top span, .bs-left span { font:700 10px/1 var(--f-body); color:var(--ink-2); text-align:center; }
.bs-holder { position:relative; border-radius:var(--r-md); overflow:hidden; }
/* Сонар: лъч, който обикаля, докато стреляш. */
.bs-sweep { position:absolute; inset:0; pointer-events:none; border-radius:inherit;
  background: conic-gradient(from 0deg at 50% 50%, rgb(140 255 190 / .0) 0deg, rgb(140 255 190 / .0) 300deg, rgb(140 255 190 / .28) 352deg, rgb(200 255 220 / .55) 360deg);
  animation: bsSweep 3.2s linear infinite; mix-blend-mode: screen; }
@keyframes bsSweep { to { transform: rotate(1turn); } }
.bs-holder:has(.bs-sweep)::after { content:''; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
  background: radial-gradient(circle at 50% 50%, transparent 0 24%, rgb(140 255 190 / .18) 24.5% 25%, transparent 25.5% 49%, rgb(140 255 190 / .18) 49.5% 50%, transparent 50.5%); }
/* Нос и кърма на корабите. */
.bs-cell.h-l { border-radius:50% 3px 3px 50% / 50% 3px 3px 50%; }
.bs-cell.h-r { border-radius:3px 50% 50% 3px / 3px 50% 50% 3px; }
.bs-cell.h-t { border-radius:50% 50% 3px 3px / 50% 50% 3px 3px; }
.bs-cell.h-b { border-radius:3px 3px 50% 50% / 3px 3px 50% 50%; }
.bs-cell.h-1 { border-radius:50%; }
.bs-cell.ship.h-h:not(.hit)::before, .bs-cell.ship.h-v:not(.hit)::before { content:''; width:28%; height:28%; border-radius:50%; background:radial-gradient(circle at 40% 35%, #d9dee6, #6b7685); box-shadow:0 0 0 1px rgb(0 0 0 / .3); }
/* Вода: леко вълниста, кораби от стомана. */
.bs-cell { aspect-ratio:1; border:0; padding:0; border-radius:3px; display:grid; place-items:center; position:relative; overflow:visible;
  background: radial-gradient(80% 60% at 30% 25%, rgb(255 255 255 / .35), transparent 60%), linear-gradient(160deg,#7fb6e6,#4f8fcf);
  font:800 .8rem/1 var(--f-body); color:var(--ink); }
.bs-cell.ship { background:linear-gradient(180deg,#9aa6b5,#5f6b7a 55%,#465160); box-shadow:inset 0 1px 0 rgb(255 255 255 / .35), inset 0 -2px 0 rgb(0 0 0 / .3); }
.bs-cell.hit { background:radial-gradient(circle at 50% 50%, #ffcf5a 0 18%, #ff6a3a 40%, #b5261a 80%); color:#fff; }
.bs-cell.hit::after { content:"✕"; text-shadow:0 1px 1px rgb(0 0 0 / .5); }
.bs-cell.miss::after { content:""; width:30%; height:30%; border-radius:50%; background:rgb(255 255 255 / .85); box-shadow:0 0 0 3px rgb(255 255 255 / .25); }
.bs-cell.near { background:linear-gradient(160deg,#a9cdee,#86b3dc); }
.bs-cell.sunk { background:linear-gradient(180deg,#3a4250,#1d2433); color:#ff8a6a; }
.bs-cell.sunk::after { content:"✕"; }
.bs-cell.pending { box-shadow:inset 0 0 0 3px var(--sun); animation: bsAim .8s ease-in-out infinite alternate; }
@keyframes bsAim { to { box-shadow:inset 0 0 0 3px var(--sun), 0 0 0 4px rgb(255 199 67 / .45); } }
/* Пръски и взрив: кръг, който се разширява от клетката. */
.bs-cell.fx-splash::before, .bs-cell.fx-boom::before, .bs-cell.fx-sunk::before { content:''; position:absolute; inset:-60%; border-radius:50%; pointer-events:none; z-index:2; }
.bs-cell.fx-splash::before { border:3px solid rgb(255 255 255 / .9); animation: bsRing .7s ease-out forwards; }
.bs-cell.fx-boom::before, .bs-cell.fx-sunk::before { background:radial-gradient(circle, #fff6c2 0 12%, #ffb23a 30%, rgb(255 80 40 / .7) 50%, transparent 70%); animation: bsBoom .7s ease-out forwards; }
.bs-cell.fx-boom, .bs-cell.fx-sunk { animation: bsShake .4s ease-in-out; }
@keyframes bsRing { from { transform:scale(.2); opacity:1; } to { transform:scale(1.4); opacity:0; } }
@keyframes bsBoom { from { transform:scale(.2); opacity:1; } 60% { opacity:.9; } to { transform:scale(1.7); opacity:0; } }
@keyframes bsShake { 20% { transform:translate(-2px,1px); } 40% { transform:translate(2px,-1px); } 60% { transform:translate(-1px,-1px); } 80% { transform:translate(1px,1px); } }
@media (prefers-reduced-motion: reduce) { .bs-sweep { animation:none; opacity:0; } .bs-cell.pending, .bs-cell.fx-boom, .bs-cell.fx-sunk { animation:none; } .bs-cell::before { display:none; } }
button.bs-cell { cursor:pointer; }
button.bs-cell:disabled { cursor:default; }
button.bs-cell:not(:disabled):hover { background:var(--sun); }
.bs-cell:focus-visible { outline:3px solid var(--sun); outline-offset:-2px; }
.bs-score { text-align:center; font-weight:700; white-space:pre; }
.bs-h { font-size:1rem; text-align:center; margin-top:14px; }
.bs-verify { text-align:center; }
.bs-art { display:grid; grid-template-columns:repeat(4,20px); gap:2px; padding:4px; background:color-mix(in srgb, var(--focus) 55%, var(--ink)); border-radius:8px; }
.bs-art span { height:20px; border-radius:3px; background:color-mix(in srgb, var(--focus) 22%, var(--surface)); }
.bs-art .s { background:var(--ink-2); }
.bs-art .x { background:var(--accent); }
.bs-art .o { background:var(--surface); box-shadow:inset 0 0 0 6px color-mix(in srgb, var(--focus) 22%, var(--surface)); }

.gf-stage { position:relative; width:min(100%,380px,calc(60vh * 110 / 160)); margin-inline:auto; }
.gf { width:100%; height:auto; display:block; touch-action:none; border-radius:16px; filter: drop-shadow(0 8px 0 #3a200c) drop-shadow(0 14px 14px rgb(30 15 0 / .3)); }
.gf.can { cursor:crosshair; }
.gf-wave { stroke-dasharray:3 2; animation: gfWave 3s linear infinite; }
@keyframes gfWave { to { stroke-dashoffset:-20; } }
.gf-flag { transform-box: fill-box; transform-origin: 0% 50%; animation: gfFlag 1.6s ease-in-out infinite alternate; }
@keyframes gfFlag { from { transform: skewY(-6deg) scaleX(.92); } to { transform: skewY(5deg) scaleX(1.04); } }
.gf-now-ring { fill:none; stroke:var(--sun); stroke-width:.7; transform-box: fill-box; transform-origin:center; animation: gfRing 1.4s ease-out infinite; }
@keyframes gfRing { from { transform:scale(.7); opacity:1; } to { transform:scale(1.5); opacity:0; } }
.gf-putter { transition: transform .14s cubic-bezier(.5,0,.9,.4); }
.gf-putter:not(.swing) { transition: none; }
.gf-ballg.gf-sink { animation: gfSink .45s ease-in forwards; transform-box: fill-box; }
@keyframes gfSink { to { opacity:0; } }
.gf-splash { fill:none; stroke:#fff; stroke-width:.7; transform-box: fill-box; transform-origin:center; animation: gfSplash .8s ease-out forwards; }
.gf-splash.late { animation-delay:.18s; }
@keyframes gfSplash { from { transform:scale(.3); opacity:1; } to { transform:scale(3.2); opacity:0; } }
.gf-ballg.fx-pop { transform-box: fill-box; }
.gf-banner { position:absolute; left:50%; top:42%; translate:-50% -50%; z-index:3; pointer-events:none; white-space:nowrap;
  padding:10px 20px; border-radius:999px; border:3px solid var(--ink); background:var(--surface); color:var(--ink);
  font:800 clamp(1.3rem,6vw,1.9rem)/1 var(--f-display); box-shadow:0 5px 0 var(--ink), 0 14px 28px rgb(0 0 0 / .25); }
.gf-banner.gold { background:linear-gradient(180deg,#ffe27a,#f5b82e); color:#3a2600; }
.gf-banner.good { background:#3fc386; color:#062b17; }
.gf-banner.meh { background:var(--surface-2); }
.gf-banner.water { background:#2f86c6; color:#fff; }
.gf-banner.intro { top:12%; font-size:clamp(1.05rem,5vw,1.4rem); background:#1d2433; color:#fff; }
.gf-confetti { position:absolute; left:50%; top:42%; pointer-events:none; z-index:4; }
.gf-confetti i { position:absolute; width:8px; height:12px; border-radius:2px; animation: gfConf 1.5s cubic-bezier(.2,.6,.4,1) forwards; }
@keyframes gfConf { 0% { transform:translate(0,0) rotate(0); opacity:1; } 60% { opacity:1; } 100% { transform:translate(var(--x), calc(var(--y) + 260px)) rotate(var(--r)); opacity:0; } }
.gf-info { display:flex; align-items:baseline; justify-content:center; gap:10px; flex-wrap:wrap; }
.gf-hole-no { font:800 var(--step-0)/1 var(--f-display); padding:4px 10px; border-radius:999px; background:#1d2433; color:#fff; }
.gf-hole-name { font:800 var(--step-1)/1.1 var(--f-display); }
.gf-par { color:var(--ink-2); font-weight:700; }
.gf-controls { display:grid; grid-template-columns:auto 1fr; gap:8px 12px; align-items:center; width:min(100%,380px); margin:16px auto 12px; }
.gf-controls .btn { grid-column:1 / -1; justify-self:center; }
.gf-controls input[type=range] { width:100%; accent-color:var(--accent); min-height:32px; }
.gf-label { font-weight:700; font-size:var(--step--1); }
.gf-power { height:10px; border-radius:999px; background:var(--surface-2); box-shadow:inset 0 1px 2px rgb(0 0 0 / .2); overflow:hidden; }
.gf-power span { display:block; height:100%; width:50%; border-radius:999px; transition: width .08s; }
.gf-card tr.now th { color:var(--accent); }

/* Дъска от дърво: светъл явор и тъмен орех с фина шарка, рамка с ръб. */
.ck { position:relative; display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); width:min(100%,440px); margin-inline:auto; padding:10px; border-radius:16px;
  background:var(--wood), linear-gradient(135deg,#7a4a22,#5a3214 60%,#6b3d1b); border:2px solid #3a200c;
  box-shadow: inset 0 2px 0 rgb(255 220 170 / .35), inset 0 -3px 0 rgb(0 0 0 / .35), 0 8px 0 #2f1a0a, 0 16px 26px rgb(40 20 5 / .35); }
.ck-cell { aspect-ratio:1; display:grid; place-items:center; border:0; padding:0; position:relative; }
.ck-cell.light { background: var(--wood),
  repeating-linear-gradient(100deg, rgb(160 110 50 / .07) 0 3px, transparent 3px 9px),
  linear-gradient(160deg,#f6e4c0,#e9cf9e); }
.ck-cell.dark { cursor:default; background: var(--wood-v),
  repeating-linear-gradient(80deg, rgb(0 0 0 / .08) 0 2px, transparent 2px 7px),
  linear-gradient(160deg,#8d5b2d,#6e4220); }
.ck-cell.dark.last { background:
  repeating-linear-gradient(80deg, rgb(0 0 0 / .06) 0 2px, transparent 2px 7px),
  linear-gradient(160deg,#a9743f,#8a592c); box-shadow: inset 0 0 0 2px rgb(255 210 120 / .55); }
.ck-cell.src { cursor:pointer; }
.ck-cell.src .ck-piece { outline:3px solid var(--sun); outline-offset:2px; }
.ck-cell.sel .ck-piece { outline:3px solid var(--focus); outline-offset:2px; transform:translateY(-4px) scale(1.07);
  box-shadow: inset 0 0 0 3px var(--ring-d), inset 0 0 0 5px var(--ring-l), 0 9px 0 -2px var(--edge), 0 14px 14px rgb(0 0 0 / .35); }
.ck-cell.tgt { cursor:pointer; }
.ck-cell.tgt::after { content:""; width:30%; height:30%; border-radius:50%; background:var(--sun); border:2px solid #3a200c;
  box-shadow:0 0 0 0 rgb(255 199 67 / .6); animation: ckTgt 1.3s ease-out infinite; }
@keyframes ckTgt { 70% { box-shadow:0 0 0 10px rgb(255 199 67 / 0); } 100% { box-shadow:0 0 0 0 rgb(255 199 67 / 0); } }
.ck-cell:focus-visible { outline:3px solid var(--focus); outline-offset:-3px; }
/* Пул: обемен, с жлеб по ръба и сянка върху дъската. */
.ck-piece { --ring-d: color-mix(in srgb, var(--p) 70%, #000); --ring-l: color-mix(in srgb, var(--p) 70%, #fff); --edge: color-mix(in srgb, var(--p) 50%, #000);
  width:80%; aspect-ratio:1; border-radius:50%; display:grid; place-items:center; position:relative;
  background:radial-gradient(circle at 34% 28%, color-mix(in srgb, var(--p) 45%, #fff) 0 10%, var(--p) 46%, color-mix(in srgb, var(--p) 75%, #000) 100%);
  box-shadow: inset 0 0 0 3px var(--ring-d), inset 0 0 0 5px var(--ring-l), inset 0 0 0 7px color-mix(in srgb, var(--p) 85%, #000),
    0 4px 0 -1px var(--edge), 0 7px 8px rgb(0 0 0 / .35);
  transition: transform .18s cubic-bezier(.2,1.4,.4,1), box-shadow .18s; }
.ck-piece.king { box-shadow: inset 0 0 0 3px var(--ring-d), inset 0 0 0 5px var(--ring-l), inset 0 0 0 7px color-mix(in srgb, var(--p) 85%, #000),
    0 4px 0 -1px var(--edge), 0 8px 0 -1px color-mix(in srgb, var(--p) 80%, #000), 0 11px 0 -1px var(--edge), 0 13px 10px rgb(0 0 0 / .35); transform:translateY(-4px); }
.ck-coord { position:absolute; font:700 9px/1 var(--f-body); color:rgb(255 225 180 / .8); pointer-events:none; text-transform:uppercase; }
.ck-coord.file { bottom:0; translate:-50% 0; }
.ck-coord.rank { left:2px; translate:0 -50%; }
.ck-trays { display:flex; justify-content:center; gap:12px 22px; flex-wrap:wrap; margin-top:16px; }
.ck-tray { display:grid; gap:4px; justify-items:center; }
.ck-tray-name { font-size:var(--step--1); color:var(--ink-2); font-weight:700; }
.ck-tray-stack { display:flex; min-height:22px; padding:4px 8px; border-radius:999px; background:linear-gradient(180deg,#6b3d1b,#4a2810);
  box-shadow: inset 0 2px 4px rgb(0 0 0 / .4); }
.ck-mini { width:16px; height:16px; margin-left:-6px; border-radius:50%; background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--p) 45%, #fff), var(--p) 50%, color-mix(in srgb, var(--p) 70%, #000));
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--p) 70%, #000), 0 1px 1px rgb(0 0 0 / .5); }
.ck-mini:first-child { margin-left:0; }
.ck-crown { color:#ffd54a; font-size:clamp(.95rem,4.2vw,1.35rem); line-height:1; text-shadow:0 1px 0 #7a5200, 0 0 6px rgb(255 213 74 / .6); }
.ck-piece.taken { opacity:.4; filter:grayscale(.5); transform:scale(.88); transition: opacity .3s .25s, transform .3s .25s; }
.ck-piece.just-taken { animation: ckHit .45s ease-out .25s backwards; }
@keyframes ckHit { 0% { opacity:1; filter:none; transform:scale(1); } 40% { transform:scale(1.15) rotate(-8deg); } }
@media (prefers-reduced-motion: reduce) { .ck-cell.tgt::after, .ck-piece.just-taken { animation:none; } }
.ck-art { display:grid; grid-template-columns:repeat(4,22px); border:2px solid var(--ink); border-radius:6px; overflow:hidden; }
.ck-art span { height:22px; display:grid; place-items:center; }
.ck-art .l { background:#f3e3c3; }
.ck-art .d { background:#8a5a2c; }

.qz-answers { display:grid; grid-template-columns:1fr; gap:10px; }
@media (min-width:520px) { .qz-answers { grid-template-columns:1fr 1fr; } }
/* Отговорите: удължени шестоъгълници с гланц, като в телевизионно шоу. */
.qz-a { position:relative; display:flex; align-items:center; gap:10px; min-height:54px; padding:10px 22px; border:0; color:#fff; font-weight:700; text-align:left; cursor:pointer;
  clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0 50%);
  background: linear-gradient(180deg, rgb(255 255 255 / .28), rgb(255 255 255 / 0) 48%, rgb(0 0 0 / .12)), var(--qa);
  transition: transform .15s cubic-bezier(.2,1.4,.4,1), filter .15s; }
.qz-a.c0 { --qa:var(--seat-1); } .qz-a.c1 { --qa:var(--seat-2); } .qz-a.c2 { --qa:#b07a14; } .qz-a.c3 { --qa:var(--seat-4); }
.qz-a:not(:disabled):hover { transform:scale(1.03); filter:brightness(1.1); }
.qz-a:disabled { cursor:default; filter:saturate(.35) brightness(.75); }
.qz-a.picked { filter:none; box-shadow:none; background: linear-gradient(180deg, rgb(255 255 255 / .4), rgb(255 255 255 / .05) 48%), var(--qa); animation: qzPick .5s cubic-bezier(.2,1.4,.4,1); }
.qz-a.picked::after { content:'✓'; margin-left:auto; font-size:1.1rem; }
@keyframes qzPick { 40% { transform:scale(1.07); } }
.qz-a:not(:disabled):active { transform:scale(.97); }
.qz-a:focus-visible { outline:3px solid var(--sun); outline-offset:3px; }
.qz-l { position:relative; display:grid; place-items:center; width:28px; height:28px; flex:none; isolation:isolate; }
.qz-l::before { content:''; position:absolute; inset:3px; rotate:45deg; border-radius:5px; z-index:-1; background:rgb(0 0 0 / .28); box-shadow: inset 0 0 0 2px rgb(255 255 255 / .5); }
.qz-hint { color:#b9c0ff; }
.qz-score { gap:8px; }
.qz-score .rv-score-item { padding:5px 12px 5px 8px; border-radius:999px; background:#141a35; color:#fff; box-shadow: inset 0 0 0 1px rgb(255 255 255 / .15), 0 3px 0 #0c1028; }
.qz-reveal { display:flex; align-items:center; gap:12px; width:min(100%,520px); margin:0 auto 12px; padding:10px 14px; border-radius:var(--r-md); background:var(--surface-2); font-weight:700; }
.qz-reveal.right { background: color-mix(in srgb, #1d9563 20%, var(--surface)); box-shadow: inset 0 0 0 2px #1d9563; }
.qz-reveal.wrong { background: color-mix(in srgb, var(--bad, #d93226) 14%, var(--surface)); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--bad, #d93226) 70%, transparent); }
.qz-reveal-mark { display:grid; place-items:center; width:34px; height:34px; border-radius:50%; flex:none; font:800 1.1rem/1 var(--f-display); color:#fff; background:var(--ink-2); }
.qz-reveal.right .qz-reveal-mark { background:#1d9563; }
.qz-reveal.wrong .qz-reveal-mark { background:var(--bad, #d93226); }
.qz-reveal-who { font-weight:500; color:var(--ink-2); }
.qz-art { display:grid; grid-template-columns:repeat(2,30px); gap:5px; }
.qz-art span { height:30px; border-radius:7px; border:2px solid var(--ink); display:grid; place-items:center; color:#fff; font-weight:800; }
.qz-art .c0 { background:var(--seat-1); } .qz-art .c1 { background:var(--seat-2); } .qz-art .c2 { background:#b07a14; } .qz-art .c3 { background:var(--seat-4); }
@media (prefers-reduced-motion: reduce) { .qz-stage::before, .qz-stage::after, .qz-secs { animation:none !important; } .qz-ring .fg { animation-timing-function:steps(4); } }
